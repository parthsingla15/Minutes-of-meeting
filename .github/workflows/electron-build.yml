name: Build and Release Electron App

on:
  push:
    tags:
      - 'v*' # Trigger only when pushing tags that start with 'v' (e.g., v1.0.0)

jobs:
  build:
    name: Build Electron Windows App
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./meeting-minutes-tool/electron-app
        run: npm install

      - name: Build and Publish with electron-builder
        working-directory: ./meeting-minutes-tool/electron-app
        run: npm run publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
